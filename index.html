  <body class="bg-[#eef1f6] text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        function enterMobileFullscreen() {
          var isMobile =
            window.innerWidth < 768 ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
            /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
          if (!isMobile) return;
          window.scrollTo(0, 1);
          var docEl = document.documentElement;
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (docEl.requestFullscreen) {
              docEl.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
            } else if (docEl.webkitRequestFullscreen) {
              try {
                docEl.webkitRequestFullscreen();
              } catch (e) {}
            }
          }
        }
        enterMobileFullscreen();
        window.addEventListener('DOMContentLoaded', enterMobileFullscreen, { passive: true });
        window.addEventListener('load', enterMobileFullscreen, { passive: true });
        ['pointerdown', 'touchstart', 'touchend', 'click'].forEach(function (evt) {
          document.addEventListener(evt, enterMobileFullscreen, { capture: true, passive: true });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
