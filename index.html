  <body class="bg-[#eef1f6] text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        // 1. Suppress incoming Web Notifications, ServiceWorker popups, and Vibrations
        try {
          if (typeof window !== 'undefined') {
            var SilentNotification = function () {
              return {
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
              };
            };
            SilentNotification.permission = 'denied';
            SilentNotification.requestPermission = function () {
              return Promise.resolve('denied');
            };
            Object.defineProperty(window, 'Notification', {
              configurable: true,
              writable: true,
              value: SilentNotification,
            });
          }
          if (navigator && navigator.vibrate) {
            navigator.vibrate = function () {
              return false;
            };
          }
          if (navigator && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                if (reg.getNotifications) {
                  reg.getNotifications().then(function (list) {
                    list.forEach(function (n) {
                      n.close();
                    });
                  });
                }
              });
            }).catch(function () {});
          }
        } catch (e) {}

        // 2. Request Screen Wake Lock so mobile stays in exam focus mode
        function requestExamWakeLock() {
          try {
            if (navigator && 'wakeLock' in navigator && navigator.wakeLock) {
              navigator.wakeLock.request('screen').catch(function () {});
            }
          } catch (e) {}
        }

        // 3. Enter Fullscreen on Mobile without interrupting native scroll
        function enterMobileFullscreen() {
          var isMobile =
            window.innerWidth < 768 ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
            /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
          if (!isMobile) return;

          requestExamWakeLock();

          var docEl = document.documentElement;
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (docEl.requestFullscreen) {
              docEl.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
            } else if (docEl.webkitRequestFullscreen) {
              try {
                docEl.webkitRequestFullscreen();
              } catch (e) {}
            }
          }
        }

        enterMobileFullscreen();
        window.addEventListener('DOMContentLoaded', enterMobileFullscreen, { passive: true });
        window.addEventListener('load', enterMobileFullscreen, { passive: true });
        window.addEventListener('pageshow', enterMobileFullscreen, { passive: true });
        ['pointerdown', 'click'].forEach(function (evt) {
          document.addEventListener(evt, enterMobileFullscreen, { capture: true, passive: true });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
